function regPlayers() {
  return DB.players.slice().sort((a, b) => (b.mmr || 0) - (a.mmr || 0) || a.name.localeCompare(b.name, 'ru'));
}
function regById(id) { return DB.players.find(p => p.id === id); }
function regByNick(nick) { const k = (nick || '').trim().toLowerCase(); return k ? DB.players.find(p => (p.nick || '').toLowerCase() === k) : null; }
function peakMmr(p) { return Math.max(p.mmr || 0, ...(p.mmrHistory || []).map(h => h.v || 0), 0); }
function regTitles(pid) {
  // сколько турниров выиграл зарегистрированный игрок (по совпадению имени)
  const p = regById(pid); if (!p) return 0;
  const key = p.name.toLowerCase();
  let g = 0;
  for (const t of DB.tournaments) {
    const first = podium(t).first;
    if (first && pname(t, first).toLowerCase() === key) g++;
  }
  return g;
}

async function goingSet(pid, on) {
  if (!isAdmin()) return;
  try {
    await loadSB();
    const { error } = await sb.rpc('rc_set_going', { p_secret: rcSecret, p_id: pid, p_on: on });
    if (error) throw error;
    await regLoad();
    if (view.screen === 'profile') render();
    toast(on ? 'Отмечен: идёт на турик' : 'Снято', '✅');
  } catch (e) { uiAlert('Не получилось — проверь связь и пароль организатора.'); }
}

function posRowsHtml(list) {

      <div class="posrowhead"><span class="posrown">${n}</span>${esc(POS_LABELS[n].replace(/\s*\(\d\)/, ''))}<span class="poscount">${players.length}</span></div>

  return `<div class="regwrap${byPos ? ' regwide' : ''}">
    <div class="reghead">
      <h2>База игроков</h2><span class="regcount">${DB.players.length}</span>
      <span style="flex:1"></span>
      <button class="btn sm ${regGoing ? 'primary' : 'ghost'}" data-action="goingfilter" data-tip="Показать только тех, кто идёт на ближайший турик (пул для драфта)">✅ Идут${goingCount ? ` (${goingCount})` : ''}</button>

      <select id="regMmr" class="regmmrsel" data-tip="Фильтр по рейтингу">${[[0, 'Любой MMR'], [2000, '2000+'], [4000, '4000+'], [6000, '6000+'], [8000, '8000+'], [10000, '10000+']].map(([v, l]) => `<option value="${v}" ${regMmrMin === v ? 'selected' : ''}>${l}</option>`).join('')}</select>

  const renderHist = () => {

  };
  renderHist();
  const addHist = () => {
    const v = parseInt(ov.querySelector('#peHV').value, 10);
    if (!Number.isFinite(v)) { ov.querySelector('#peHV').focus(); return; }
    hist.push({ v, note: ov.querySelector('#peHN').value.trim() });
    ov.querySelector('#peHV').value = ''; ov.querySelector('#peHN').value = '';
    renderHist(); ov.querySelector('#peHV').focus();
  };
  ov.querySelector('#peHAdd').onclick = addHist;

  if (existing) ov.querySelector('#peDel').onclick = async () => {
    if (!isAdmin()) { uiAlert('Удалять игроков может только администратор.'); return; }

function actorArgs() {

function myActorId() { return isAdmin() ? 'admin' : (isPlayer() ? myId() : null); }
function lobbySignups(lid) { return LB.signups.filter(s => s.lobby_id === lid); }
function myPendingCount() {
  const mine = myActorId(); if (!mine) return 0;
  const ids = LB.list.filter(l => l.created_by === mine).map(l => l.id);
  return LB.signups.filter(s => ids.includes(s.lobby_id) && s.status === 'requested').length;

async function lobbyLoad() {
  lbSyncing = true; if (view.screen === 'lobbies') renderTopbar();
  try {
    await loadSB();
    const [r1, r2] = await Promise.all([
      sb.from('lobbies').select('*').order('created_at', { ascending: false }),
      sb.from('lobby_signups').select('*')
    ]);
    if (r1.error) throw r1.error; if (r2.error) throw r2.error;
    LB.list = r1.data || []; LB.signups = r2.data || [];
    lbSyncing = false;
    const pend = myPendingCount();
    if (lobbyInited && pend > lastPending) toast('Вас откликнули — новая заявка в лобби', '📨', true);
    lastPending = pend; lobbyInited = true;
    if (view.screen === 'lobbies') render(); else renderTopbar();
    return true;
  } catch (e) { lbSyncing = false; if (view.screen === 'lobbies') { renderTopbar(); toast('Нет связи с базой', '⚠️'); } return false; }
}

function tourInfoHtml(t) {
  const i = (t.opts && t.opts.info) || {};
  const ed = canEdit(t);
  const chips = [];
  if (i.when) chips.push(`<span>📅 ${esc(i.when)}</span>`);
  if (i.venue) chips.push(`<span>📍 ${linkify(i.venue)}</span>`);
  if (i.slots) chips.push(`<span>👥 ${esc(i.slots)}</span>`);
  if (t.opts && t.opts.mmrCap) chips.push(`<span>🎚 лимит ${t.opts.mmrCap} MMR</span>`);
  if (i.prize) chips.push(`<span class="prize">🏆 ${esc(i.prize)}</span>`);
  if (i.entry) chips.push(`<span>💵 ${esc(i.entry)}</span>`);
  const links = [];
  if (i.contact) {
    const c = i.contact.trim();
    const digits = (c.match(/\d/g) || []).length;
    if (URL_RE.test(c)) { const { url, label } = linkMeta(c); links.push(`<a class="btn sm ghost" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`); }
    else if (digits >= 7) links.push(`<button class="btn sm ghost" data-action="wa" data-phone="${esc(c)}" data-tip="Написать в WhatsApp">📞 ${esc(c)}</button>`);
    else links.push(`<span class="ilink">📞 ${esc(c)}</span>`);
  }
  if (i.stream) {
    const url = /^https?:\/\//.test(i.stream) ? i.stream : 'https://' + i.stream;
    links.push(`<a class="btn sm ghost" href="${esc(url)}" target="_blank" rel="noopener">📺 Стрим</a>`);
  }
  const has = chips.length || links.length || i.rules;
  if (!has) return ed
    ? `<div class="tourinfo cut empty2"><span class="note">Заполни инфо для участников — дата, место, приз, лимит MMR, правила, контакт. Видно всем и по ссылке.</span><button class="btn sm ghost" data-action="editinfo">＋ Инфо</button></div>`
    : '';
  return `<div class="tourinfo cut">
    <div class="tourinfo-row">${chips.join('')}<span style="flex:1"></span>${ed ? `<button class="mini" data-action="editinfo" data-tip="Редактировать инфо">✎</button>` : ''}</div>
    ${i.rules ? `<div class="tourinfo-rules">${linkify(i.rules)}</div>` : ''}
    ${links.length ? `<div class="tourinfo-links">${links.join('')}</div>` : ''}
  </div>`;
}

function draftPoolItem(p, admin) {
  return `<div class="dpi">
    ${avatarByName(p.nick || p.name)}<span class="dpn">${esc(p.nick || p.name)}</span>${posArr(p).length ? `<span class="dpp">${posArr(p).join('/')}</span>` : ''}<span class="dpm">${p.mmr != null ? p.mmr : '—'}</span>

  </div>`;
}
function draftTeamCard(t, tm, cap, admin) {
  const sum = tm.members.reduce((a, id) => { const p = regById(id); return a + ((p && p.mmr) || 0); }, 0);
  const rem = cap - sum, over = cap > 0 && sum > cap;
  const members = tm.members.map(id => {
    const p = regById(id), isCap = id === tm.captainId;
    const nm = p ? (p.nick || p.name) : id;
    return `<span class="dmem ${isCap ? 'cap' : ''}">${isCap ? '★' : ''}${avatarByName(nm)}<span class="dmn">${esc(nm)}</span><small>${p && p.mmr != null ? p.mmr : ''}</small>${admin ? `<button class="mini del" data-action="draftremmem" data-tid="${tm.id}" data-pid="${id}" data-tip="${isCap ? 'Убрать всю команду' : 'Вернуть в пул'}">✕</button>` : ''}</span>`;
  }).join('');
  return `<div class="dteam cut ${over ? 'over' : ''}">
    <div class="dteam-h"><b>${esc(tm.name)}</b><span class="dteam-mmr">${sum}${cap > 0 ? ` / ${cap}` : ''}${cap > 0 ? (over ? ` <span class="cbad">−${sum - cap}</span>` : ` <span class="crem">+${rem}</span>`) : ''}</span>${admin ? `<button class="mini del" data-action="draftremteam" data-tid="${tm.id}" data-tip="Удалить команду">✕</button>` : ''}</div>
    <div class="dteam-list">${members || '<span class="note">пусто</span>'}</div>
    ${admin ? `<button class="mini dadd" data-action="draftadd" data-tid="${tm.id}" data-tip="Добавить игрока из пула">＋ игрок</button>` : ''}
  </div>`;
}
function draftHtml(t) {
  const admin = isAdmin();
  t.draftTeams = t.draftTeams || [];
  const assigned = new Set();
  t.draftTeams.forEach(tm => tm.members.forEach(id => assigned.add(id)));
  const pool = DB.players.filter(p => p.going && !assigned.has(p.id)).sort((a, b) => (b.mmr || 0) - (a.mmr || 0));
  const cap = t.opts.mmrCap || 0;
  const ready = t.draftTeams.filter(x => x.members.length).length;
  return `<div class="draftwrap">
    <div class="pophdr cut">
      <span class="tl">🎖 Драфт</span>
      <span class="note">Пул — игроки с меткой «идёт». Ставь капитанов и раздавай игроков по командам.</span>
      <span style="flex:1"></span>
      ${admin ? `<button class="btn primary sm" data-action="draftform" ${ready < 2 ? 'disabled' : ''} data-tip="Собрать сетку/группы из команд">Сформировать сетку →</button>` : ''}
    </div>
    <div class="draftgrid">
      <div class="draftpool cut">
        <div class="draftcol-h">Пул <span>${pool.length}</span></div>
        <div class="draftpool-list">${pool.length ? pool.map(p => draftPoolItem(p, admin)).join('') : `<div class="note" style="padding:12px">Пул пуст. Отметь игроков <b>«✅ идёт»</b> на странице «Игроки».</div>`}</div>
      </div>
      <div class="draftteamswrap">
        <div class="draftcol-h">Команды <span>${t.draftTeams.length}</span></div>
        <div class="draftteams">${t.draftTeams.length ? t.draftTeams.map(tm => draftTeamCard(t, tm, cap, admin)).join('') : `<div class="note" style="padding:12px">Команд нет. Нажми <b>«★ Кэп»</b> у игрока в пуле, чтобы сделать его капитаном.</div>`}</div>
      </div>
    </div>
  </div>`;
}

      <div class="note" id="daSum" style="margin-bottom:8px"></div>
      <input id="daSearch" placeholder="🔎 Поиск по пулу…" autocomplete="off">
      <div id="daList" class="laList"></div>
    </div>
    <div class="mrow"><span style="flex:1"></span><button class="btn ghost" id="daClose">Готово</button></div>`, true);
  const renderList = (q) => {
    const box = ov.querySelector('#daList'); if (!box) return;
    const t2 = curT(); const tm2 = (t2.draftTeams || []).find(x => x.id === tid);
    if (!tm2) { closeModal(ov); return; }
    const assigned = new Set(); t2.draftTeams.forEach(x => x.members.forEach(id => assigned.add(id)));
    const sum = tm2.members.reduce((a, id) => { const p = regById(id); return a + ((p && p.mmr) || 0); }, 0);
    const rem = cap > 0 ? cap - sum : Infinity;
    ov.querySelector('#daSum').innerHTML = `Сумма <b>${sum}</b>${cap > 0 ? ` · осталось <b>${rem}</b> до ${cap}` : ''}`;
    q = (q || '').trim().toLowerCase();
    let players = DB.players.filter(p => p.going && !assigned.has(p.id));
    if (cap > 0) players = players.filter(p => (p.mmr || 0) <= rem);
    if (q) players = players.filter(p => (p.name + ' ' + (p.nick || '')).toLowerCase().includes(q));
    players.sort((a, b) => (b.mmr || 0) - (a.mmr || 0));
    box.innerHTML = players.length
      ? players.map(p => `<button type="button" class="regpickitem daItem" data-pid="${p.id}">
          ${avatarByName(p.nick || p.name)}<span class="rpn">${esc(p.nick || p.name)}</span>${posArr(p).length ? `<span class="rpp">${posArr(p).join('/')}</span>` : ''}<span class="rpm">${p.mmr != null ? p.mmr : '—'}</span>
        </button>`).join('')
      : `<div class="note" style="padding:10px">${cap > 0 ? `Никто не влезает в остаток (${rem}) или пул пуст.` : 'Пул пуст.'}</div>`;
    box.querySelectorAll('.daItem').forEach(btn => btn.onclick = () => {
      const cur = curT(); const c = (cur.draftTeams || []).find(x => x.id === tid);
      if (c && !c.members.includes(btn.dataset.pid)) { c.members.push(btn.dataset.pid); save(); }
      renderList(ov.querySelector('#daSearch').value);
      if (view.screen === 'tour') { /* обновим фон позже */ }
    });
  };
  ov.querySelector('#daSearch').addEventListener('input', e => renderList(e.target.value));
  ov.querySelector('#daClose').onclick = () => { closeModal(ov); render(); };
  ov.onclick = e => { if (e.target === ov && ov._downSelf) { closeModal(ov); render(); } };
  (DB.players.length ? Promise.resolve() : regLoad()).then(() => renderList(''));
}
function screenTour() {
  const t = curT();
  if (!t) { view = { screen: 'home', tid: null }; return screenHome(); }
  if (t.phase === 'draft') return tourInfoHtml(t) + draftHtml(t);
  const champ = podium(t).first;
  let html = coachHtml() + tourInfoHtml(t) + podiumHtml(t);

  if (t.format === 'single') {
    let cols = elimColsHtml(t, 'wb', champ);
    if (t.thirdId) cols += colHtml('Матч за 3-е место', '', matchHtml(t, t.matches[t.thirdId], null));
    html += sectionHtml('Сетка', Object.keys(t.players).length + ' игроков', cols);
  } else if (t.format === 'double') {
    let cols = elimColsHtml(t, 'wb', champ);
    const gf = t.matches[t.gfId];
    cols += colHtml('Гранд-финал', '', matchHtml(t, gf, champ));
    if (gf2Needed(t))
      cols += colHtml('Решающий матч', '', matchHtml(t, t.matches[t.gf2Id], champ));
    html += sectionHtml('Верхняя сетка', Object.keys(t.players).length + ' игроков', cols);
    if (byBracket(t, 'lb').length)
      html += sectionHtml('Нижняя сетка', 'вторая жизнь', elimColsHtml(t, 'lb', champ));
  } else if (t.format === 'rr') {
    html += rrHtml(t, champ);
  } else {
    html += groupsHtml(t, champ);
    if (t.phase === 'po') {
      let cols = elimColsHtml(t, 'po', champ);
      if (t.thirdId) cols += colHtml('Матч за 3-е место', '', matchHtml(t, t.matches[t.thirdId], null));
      html += sectionHtml('Плей-офф', '', cols);
    }
  }
  return html;
}

function rrHtml(t, champ) {
  const ro = !canEdit(t);
  const draws = drawsOn(t);
  const g = t.groups[0];
  const st = standings(t, g);
  const gms = groupMatches(t, g);
  const gp = gms.filter(matchDone).length;
  const done = gms.length > 0 && gp === gms.length;
  const medal = ['🥇', '🥈', '🥉'];
  const rows = st.map((s, i) => {
    const tools = ro ? '' : `<span class="grow-tools">

    <div class="rrwrap">

function groupsHtml(t, champ) {

  let html = `<div class="pophdr cut">
    <span class="tl">Групповой этап</span>`;
  if (!locked) {
    html += `<span class="note">Тяни игрока из таблицы в другую группу — составы пересоберутся.</span>

      </tr>`;

    const matches = groupMatchesHtml(t, g, locked);
    html += `<div class="gcard cut" data-gid="${g.id}">
      <div class="ghead"><h3>Группа ${esc(g.name)}</h3><span class="gprog">${gp}/${gms.length} сыграно</span><span class="sp"></span>
        ${!locked ? `<button class="mini" data-tip="Добавить игрока в группу ${esc(g.name)}" data-action="gadd" data-gid="${g.id}" style="font-size:15px">＋</button>` : ''}

}
function gmHtml(t, m, locked) {
  const ro = !canEdit(t);
  const editable = !locked && !ro;
  const dr = !!m.draw;
  const r = isReady(m) && !dr && editable;
  const w0 = m.winner && m.winner === m.slots[0].pid, w1 = m.winner && m.winner === m.slots[1].pid;
  const s0 = m.slots[0].score == null ? '·' : m.slots[0].score;
  const s1 = m.slots[1].score == null ? '·' : m.slots[1].score;
  const dis = editable ? '' : 'disabled';
  const id = m.id;
  const vs = (canDraw(t, m) && editable)
    ? `<button class="vs draw ${dr ? 'on' : ''}" data-action="draw" data-mid="${id}" data-tip="Ничья">=</button>`
    : `<span class="vs">${dr ? '=' : ':'}</span>`;
  return `<div class="gm cut ${r ? 'ready' : ''} ${dr ? 'draw' : ''}">
    <button class="pname ${w0 ? 'winner' : ''}" ${dis} data-action="win" data-mid="${id}" data-si="0" ${r ? 'data-tip="Клик — победа"' : ''}>${esc(pname(t, m.slots[0].pid))}</button>
    <button class="score" ${dis} data-action="score" data-mid="${id}" data-si="0" data-tip="ЛКМ +1 · ПКМ −1">${s0}</button>
    ${vs}
    <button class="score" ${dis} data-action="score" data-mid="${id}" data-si="1" data-tip="ЛКМ +1 · ПКМ −1">${s1}</button>
    <button class="pname right ${w1 ? 'winner' : ''}" ${dis} data-action="win" data-mid="${id}" data-si="1" ${r ? 'data-tip="Клик — победа"' : ''}>${esc(pname(t, m.slots[1].pid))}</button>
    ${matchDone(m) && editable ? `<button class="mini" data-tip="Отменить результат" data-action="undo" data-mid="${id}">↺</button>` : '<span></span>'}
  </div>`;
}

function drawEdges() {
  const t = view.screen === 'tour' ? curT() : null;
  document.querySelectorAll('.bsec').forEach(sec => {
    const svg = sec.querySelector('svg.edges');
    if (!svg || !t) return;
    const z = zoomLvl || 1;        /* контент внутри .zoomw отмасштабирован — переводим в его координаты */
    const cols = sec.querySelector('.cols');
    svg.setAttribute('width', Math.ceil(cols ? cols.offsetWidth : sec.scrollWidth / z));
    svg.setAttribute('height', Math.ceil(cols ? cols.offsetHeight : sec.scrollHeight / z));
    svg.innerHTML = '';
    const champ = podium(t).first;
    const sr = sec.getBoundingClientRect();
    sec.querySelectorAll('.match').forEach(el => {
      const m = t.matches[el.dataset.mid];
      if (!m || !m.wTo) return;
      const tEl = sec.querySelector('#m_' + m.wTo.mid);
      if (!tEl) return;
      const sEl = tEl.querySelector('.slot[data-si="' + m.wTo.slot + '"]') || tEl;
      const r1 = el.getBoundingClientRect(), r2 = sEl.getBoundingClientRect(), r2c = tEl.getBoundingClientRect();
      const x1 = (r1.right - sr.left + sec.scrollLeft) / z;
      const y1 = (r1.top + r1.height / 2 - sr.top + sec.scrollTop) / z;
      const x2 = (r2c.left - sr.left + sec.scrollLeft) / z;
      const y2 = (r2.top + r2.height / 2 - sr.top + sec.scrollTop) / z;
      const mx = (x1 + x2) / 2;
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', `M${x1},${y1} L${mx},${y1} L${mx},${y2} L${x2},${y2}`);
      if (champ && m.winner === champ && t.matches[m.wTo.mid].slots[m.wTo.slot].pid === champ)
        p.setAttribute('class', 'champ');
      svg.appendChild(p);
    });
  });
}
window.addEventListener('resize', () => requestAnimationFrame(drawEdges));

const MUT_ACTIONS = new Set(['win', 'score', 'draw', 'undo', 'rename', 'pdel', 'fill', 'gadd', 'gdel', 'makepo', 'resetpo', 'reseed', 'addp', 'trename', 'raddgo', 'rdel', 'editinfo', 'draftcap', 'draftadd', 'draftremmem', 'draftremteam', 'draftform']);
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const a = el.dataset.action;
  const t = curT();
  if (MUT_ACTIONS.has(a) && t && !canEdit(t)) { toast('Режим зрителя — менять нельзя', '👁'); return; }
  if (a === 'tbmenu') { tbMenuOpen = !tbMenuOpen; renderTopbar(); return; }
  if (tbMenuOpen && a !== 'tbmenu') { tbMenuOpen = false; renderTopbar(); }

  if (a === 'home') { view = { screen: 'home', tid: null }; render(); }
  else if (a === 'new') { view = { screen: 'create', tid: null }; render(); regLoad(); }
  else if (a === 'help') showHelp();
  else if (a === 'coachoff') { localStorage.setItem('turnir_coach2', '1'); render(); }
  else if (a === 'editinfo') { infoEditModal(); }
  else if (a === 'draftcap') {
    if (!t || !isAdmin()) return;
    const p = regById(el.dataset.pid); if (!p) return;
    t.draftTeams = t.draftTeams || [];
    t.draftTeams.push({ id: uid(), captainId: p.id, name: p.nick || p.name, members: [p.id] });
    save(); render();
  }
  else if (a === 'draftadd') { if (t && isAdmin()) draftAddModal(t, el.dataset.tid); }
  else if (a === 'draftremmem') {
    if (!t || !isAdmin()) return;
    const tm = (t.draftTeams || []).find(x => x.id === el.dataset.tid); if (!tm) return;
    if (el.dataset.pid === tm.captainId) t.draftTeams = t.draftTeams.filter(x => x.id !== tm.id);
    else tm.members = tm.members.filter(id => id !== el.dataset.pid);
    save(); render();
  }
  else if (a === 'draftremteam') {
    if (!t || !isAdmin()) return;
    t.draftTeams = (t.draftTeams || []).filter(x => x.id !== el.dataset.tid); save(); render();
  }
  else if (a === 'draftform') {
    if (!t || !isAdmin()) return;
    if (await uiConfirm('Собрать сетку из этих команд? Пул драфта закроется.', { title: 'Сформировать сетку?', ok: 'Собрать' })) draftForm(t);
  }
  else if (a === 'open') { view = { screen: 'tour', tid: el.dataset.tid }; render(); if (curT() && curT().phase === 'draft') regLoad(); }
  else if (a === 'del') {
    const tt = DB.tournaments.find(x => x.id === el.dataset.tid);
    if (tt && await uiConfirm(`Турнир «${tt.name}» удалится навсегда, вместе с результатами.`, { title: 'Удалить турнир?', ok: 'Удалить', danger: true })) {
      DB.tournaments = DB.tournaments.filter(x => x.id !== el.dataset.tid);
      delArchive(el.dataset.tid);
      save(); render();
      toast('Турнир удалён');
    }
  }
  else if (a === 'export') exportAll();
  else if (a === 'import') document.getElementById('importFile').click();
  else if (a === 'addp') { if (t) addPlayerFlow(t); }
  else if (a === 'roster') { rosterOpen = !rosterOpen; render(); if (rosterOpen) { const i = document.getElementById('rosterInput'); if (i) i.focus(); } }
  else if (a === 'raddgo') {
    if (!t) return;
    const inp = document.getElementById('rosterInput');
    const nn = inp ? inp.value.trim() : '';
    if (!nn) { if (inp) inp.focus(); return; }
    await addPlayerByName(t, nn);
    const ni = document.getElementById('rosterInput');
    if (ni) ni.focus();
  }
  else if (a === 'rdel') { if (t) deletePlayerFlow(t, el.dataset.pid); }
  else if (a === 'reseed') { if (t) reseedFlow(t); }
  else if (a === 'zoomin') setZoom(zoomLvl + 0.1);
  else if (a === 'zoomout') setZoom(zoomLvl - 0.1);
  else if (a === 'zoomreset') setZoom(1);
  else if (a === 'tv') {
    tvMode = !tvMode;
    document.body.classList.toggle('tv', tvMode);
    if (tvMode) {
      rosterOpen = false;
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    } else if (document.exitFullscreen && document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }
    render();
  }
  else if (a === 'shot') { if (t) exportImage(t); }
  else if (a === 'timer') { timerOpen = !timerOpen; renderTimerW(); renderTopbar(); }
  else if (a === 'tstart') {
    timer.run = !timer.run;
    if (timer.run && timer.left > 0) {
      if (!timer.iv) timer.iv = setInterval(tickTimer, 1000);
    } else {
      timer.run = false;
      if (timer.iv) { clearInterval(timer.iv); timer.iv = null; }
    }
    updateTimerUI();
  }
  else if (a === 'treset') {
    timer.left = timer.total; timer.run = false;
    if (timer.iv) { clearInterval(timer.iv); timer.iv = null; }
    updateTimerUI();
  }
  else if (a === 'tset') {
    timer.total = (+el.dataset.min) * 60; timer.left = timer.total; timer.run = false;
    if (timer.iv) { clearInterval(timer.iv); timer.iv = null; }
    updateTimerUI();
  }
  else if (a === 'pstats') showPlayerStats(el.dataset.name);
  else if (a === 'players') { view = { screen: 'players', tid: null }; render(); regLoad(); }
  else if (a === 'lobbies') { view = { screen: 'lobbies', tid: null }; render(); lobbyLoad(); }
  else if (a === 'lobrefresh') { lobbyLoad(); }
  else if (a === 'lobcreate') { lobbyCreateModal(); }
  else if (a === 'lobadd') { lobbyAddModal(el.dataset.lid); }
  else if (a === 'lobjoin') {
    if (!isPlayer()) { uiAlert('Войди как игрок (🔒 → Я игрок), чтобы подать заявку.'); return; }
    lobbyRpc('rc_lobby_join', { p_username: rcPlayer.username, p_password: rcPlayer.pass, p_lobby: el.dataset.lid, p_note: '' }, 'Заявка отправлена 📨');
  }
  else if (a === 'lobleave') {
    if (!isPlayer()) return;
    if (await uiConfirm('Отозвать заявку / выйти из лобби?', { ok: 'Да' }))
      lobbyRpc('rc_lobby_leave', { p_username: rcPlayer.username, p_password: rcPlayer.pass, p_lobby: el.dataset.lid }, 'Готово');
  }
  else if (a === 'lobaccept') { const ar = actorArgs(); if (ar) lobbyRpc('rc_lobby_signup_status', Object.assign({ p_signup: el.dataset.sid, p_status: 'accepted' }, ar), 'Принят в состав'); }
  else if (a === 'lobdecline') { const ar = actorArgs(); if (ar) lobbyRpc('rc_lobby_signup_status', Object.assign({ p_signup: el.dataset.sid, p_status: 'declined' }, ar)); }
  else if (a === 'lobclose') {
    const ar = actorArgs(); if (!ar) return;
    if (await uiConfirm('Закрыть лобби? Оно удалится вместе с заявками.', { title: 'Закрыть лобби?', ok: 'Закрыть', danger: true }))
      lobbyRpc('rc_lobby_close', Object.assign({ p_lobby: el.dataset.lid }, ar), 'Лобби закрыто');
  }
  else if (a === 'adminlogin') { adminLoginModal(); }
  else if (a === 'pedit') { if (isAdmin()) playerEditModal(el.dataset.pid || null); }
  else if (a === 'managelogin') { if (isAdmin()) manageLoginModal(el.dataset.pid); }
  else if (a === 'lfttoggle') { lftModal(el.dataset.pid); }
  else if (a === 'lftfilter') {
    const list = document.querySelector('.reglist'); if (!list) return;
    el.classList.toggle('primary', list.classList.toggle('lftonly'));
  }
  else if (a === 'regview') { regView = regView === 'pos' ? 'list' : 'pos'; render(); }
  else if (a === 'goingfilter') { regGoing = !regGoing; render(); }
  else if (a === 'goingtoggle') { if (isAdmin()) { const p = regById(el.dataset.pid); if (p) goingSet(p.id, !p.going); } }
  else if (a === 'goingclear') {
    if (!isAdmin()) return;
    if (await uiConfirm('Снять участие у всех игроков? (обычно перед новым турником)', { title: 'Сбросить участие?', ok: 'Сбросить', danger: true })) {
      try { await loadSB(); const { error } = await sb.rpc('rc_clear_going', { p_secret: rcSecret }); if (error) throw error; await regLoad(); toast('Участие сброшено'); }
      catch (e) { uiAlert('Не получилось — проверь связь и пароль.'); }
    }
  }
  else if (a === 'posfilter') { regPosFilter = el.dataset.val; render(); }
  else if (a === 'cmode') {
    createMode = el.dataset.mode;
    const draft = createMode === 'draft';
    document.getElementById('draftTools').classList.toggle('hidden', !draft);
    document.getElementById('partBody').classList.toggle('hidden', draft);
    document.getElementById('soloTools').classList.toggle('hidden', createMode !== 'solo');
    document.getElementById('teamTools').classList.toggle('hidden', createMode !== 'teams');
    document.querySelectorAll('[data-action=cmode]').forEach(bt => {
      const on = bt.dataset.mode === createMode;
      bt.classList.toggle('primary', on); bt.classList.toggle('ghost', !on);
    });
    const ta = document.getElementById('cPlayers');
    if (ta) ta.placeholder = createMode === 'teams' ? 'Тигры: Азамат, Ерлан\nВолки: Данияр, Санжар\n...' : 'Азамат\nДанияр\nЕрлан\n...';
    updatePCount();
  }
  else if (a === 'addteam') {
    const ta = document.getElementById('cPlayers'); if (!ta) return;
    const cnt = ta.value.split('\n').filter(s => s.includes(':')).length;
    const cur = ta.value.replace(/\s+$/, '');
    ta.value = (cur ? cur + '\n' : '') + 'Команда ' + (cnt + 1) + ': ';
    updatePCount(); ta.focus();
    ta.selectionStart = ta.selectionEnd = ta.value.length;
  }
  else if (a === 'teamfill') { teamFillModal(+el.dataset.line); }
  else if (a === 'pickreg') {
    const ta = document.getElementById('cPlayers'); if (!ta) return;
    const cur = ta.value.replace(/\s+$/, '');
    ta.value = (cur ? cur + '\n' : '') + el.dataset.name;
    const s = document.getElementById('cReg'); if (s) s.value = '';
    const box = document.getElementById('cRegList'); if (box) { box.innerHTML = ''; box.classList.remove('on'); }
    updatePCount(); ta.focus();
  }
  else if (a === 'myprofile') { if (isPlayer()) { view = { screen: 'profile', pid: myId(), tid: null }; render(); } }
  else if (a === 'logout') {
    if (isPlayer()) { rcPlayer = null; localStorage.removeItem('rc_player'); toast('Вышел', '🔒'); view = { screen: 'players', tid: null }; render(); regLoad(); }
  }
  else if (a === 'pprofile') { view = { screen: 'profile', pid: el.dataset.pid, tid: null }; render(); }
  else if (a === 'wa') { const ph = (el.dataset.phone || '').replace(/[^\d]/g, ''); if (ph) window.open('https://wa.me/' + ph, '_blank', 'noopener'); }
  else if (a === 'pregdel') {
    if (!isAdmin()) return;
    const p = regById(el.dataset.pid);
    if (p && await uiConfirm(`Удалить ${p.name} из базы игроков?`, { title: 'Удалить игрока?', ok: 'Удалить', danger: true })) {
      try { await regDeleteRemote(p.id); await regLoad(); toast('Игрок удалён из базы'); }
      catch (e) { uiAlert('Не удалилось — проверь связь и пароль организатора.'); }
    }
  }
  else if (a === 'share') { if (t) shareFlow(t); }
  else if (a === 'mute') {
    soundOn = !soundOn;
    localStorage.setItem('turnir_sound', soundOn ? '1' : '0');
    if (soundOn) { tone(880, 0, 0.1, 0.1); }
    renderTopbar();
    toast(soundOn ? 'Звук включён' : 'Звук выключен', soundOn ? '🔊' : '🔇');
  }
  else if (a === 'trename') {
    if (!t) return;
    const nn = await uiPrompt('Название турнира', t.name);
    if (nn) { t.name = nn; save(); render(); }
  }
  else if (a === 'rematch') {
    const src = DB.tournaments.find(x => x.id === el.dataset.tid);
    if (src) rematch(src);
  }
  else if (a === 'advtoggle') {
    const box = document.getElementById('advOpts'); if (!box) return;
    const collapsed = box.classList.toggle('hidden');
    el.textContent = '⚙ Дополнительно ' + (collapsed ? '▾' : '▴');
  }
  else if (a === 'seedmmr') {
    const ta = document.getElementById('cPlayers'); if (!ta) return;
    const lines = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
    if (lines.length < 2) return;
    const strength = s => { const e = parseEntry(s); return (e.members && e.members.length) ? e.members.reduce((a, m) => a + (regMmrOf(m) || 0), 0) : (regMmrOf(e.name) || 0); };
    lines.sort((a, b) => strength(b) - strength(a));
    ta.value = lines.join('\n');
    updatePCount();
    toast('Посев по рейтингу', '📊');
  }
  else if (a === 'shufflecreate') {
    const ta = document.getElementById('cPlayers');
    const lines = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
    if (lines.length < 2) return;
    ta.value = shuffleArr(lines).join('\n');
    updatePCount();
    toast('Порядок перемешан', '🎲');
  }

  else if (a === 'win') {
    if (!t) return;
    setWinner(t, t.matches[el.dataset.mid], +el.dataset.si);
  }
  else if (a === 'score') {
    if (!t) return;
    const m = t.matches[el.dataset.mid], si = +el.dataset.si;
    if (!m.slots[si].pid || m.slots[si].pid === 'BYE' || m.auto || matchDone(m)) return;
    m.slots[si].score = (m.slots[si].score || 0) + 1;
    const need = winsNeededM(t, m);
    if (need > 1 && isReady(m) && m.slots[si].score >= need) {
      m.winner = m.slots[si].pid;
      propagate(t, m);
      resolveByes(t);
      sndWin();
    }
    save(); render();
  }
  else if (a === 'draw') {
    if (!t) return;
    const m = t.matches[el.dataset.mid];
    if (!canDraw(t, m)) return;
    if (m.draw) { m.draw = false; }               // повторный клик — снять ничью
    else { m.winner = null; m.auto = false; m.draw = true; }
    save(); render();
  }
  else if (a === 'undo') {
    if (!t) return;
    cascadeUndo(t, t.matches[el.dataset.mid]);
    save(); render();
    toast('Результат отменён', '↺');
  }
  else if (a === 'rename') {
    if (!t) return;
    const pid = el.dataset.pid;
    const p = t.players[pid];
    const nn = await uiPrompt('Имя — или «Команда: игрок1, игрок2»', p ? entryStr(p) : pname(t, pid));
    if (nn && p) { const ent = parseEntry(nn); p.name = ent.name; p.members = ent.members; save(); render(); }
  }
  else if (a === 'pdel') {
    if (!t) return;
    const pid = el.dataset.pid;
    if (!await uiConfirm(`${pname(t, pid)} уйдёт из сетки, его место станет свободным. Результаты его матчей откатятся.`, { title: 'Убрать игрока?', ok: 'Убрать', danger: true })) return;
    const nm = pname(t, pid);
    removeFromElim(t, pid);
    save(); render();
    toast(`${nm} убран из сетки`);
  }
  else if (a === 'fill') {
    if (!t) return;
    const m = t.matches[el.dataset.mid], si = +el.dataset.si;
    pickPlayerModal(t, { title: 'Кто на это место?', onPick: nn => {
      const ent = parseEntry(nn);
      const pid = uid();
      t.players[pid] = { name: ent.name, members: ent.members };
      seatPlayer(t, m, si, pid);
      save(); render();
      toast(`${ent.name} в игре!`, '🎮');
    } });
  }
  else if (a === 'gadd') {
    if (!t) return;
    const g = grp(t, el.dataset.gid);
    if (groupHasResults(t, g) && !await uiConfirm(`В группе ${g.name} уже есть результаты — они сбросятся, потому что расписание пересоберётся.`, { ok: 'Продолжить' })) return;
    const nn = await uiPrompt(`Новый игрок в группу ${g.name}`, '', 'Имя');
    if (!nn) return;
    const pid = uid();
    t.players[pid] = { name: nn };
    g.pids.push(pid);
    genGroupMatches(t, g);
    save(); render();
    toast(`${nn} добавлен в группу ${g.name}`, '🎮');
  }
  else if (a === 'gdel') {
    if (!t) return;
    const g = grp(t, el.dataset.gid), pid = el.dataset.pid;
    if (!await uiConfirm(`${pname(t, pid)} уйдёт из турнира.` + (groupHasResults(t, g) ? ` Результаты группы ${g.name} сбросятся.` : ''), { title: 'Убрать игрока?', ok: 'Убрать', danger: true })) return;
    g.pids = g.pids.filter(p => p !== pid);
    delete t.players[pid];
    genGroupMatches(t, g);
    save(); render();
  }
  else if (a === 'makepo') {
    if (!t) return;
    const unfinished = t.groups.some(g => groupMatches(t, g).some(m => !m.winner));
    if (unfinished && !await uiConfirm('Не все матчи в группах сыграны. Сформировать плей-офф по текущим таблицам?', { ok: 'Да, формируем' })) return;
    const adv = +document.getElementById('poAdv').value;
    const third = document.getElementById('poThird').checked;
    makePO(t, adv, third);
  }
  else if (a === 'resetpo') {
    if (!t) return;
    if (await uiConfirm('Сетка плей-офф и её результаты удалятся, группы снова откроются.', { title: 'Сбросить плей-офф?', ok: 'Сбросить', danger: true })) resetPO(t);
  }
});

document.addEventListener('contextmenu', e => {
  const sc = e.target.closest('[data-action="score"]');
  if (sc && !sc.disabled) {
    e.preventDefault();
    const t = curT();
    if (!t || !canEdit(t)) return;
    const m = t.matches[sc.dataset.mid], si = +sc.dataset.si;
    if (!m.slots[si].pid || m.slots[si].pid === 'BYE' || m.auto || m.winner) return;
    m.slots[si].score = Math.max(0, (m.slots[si].score || 0) - 1);
    save(); render();
    return;
  }
  if (e.target.closest('.pname[data-mid], tr[data-pid]')) e.preventDefault();
});

document.addEventListener('change', e => {
  if (e.target.id === 'regMmr') { regMmrMin = +e.target.value; render(); return; }
  if (e.target.id === 'cDraws') { const pb = document.getElementById('ptsBox'); if (pb) pb.classList.toggle('hidden', !e.target.checked); return; }
  if (e.target.id === 'poAdv') {
    const t = curT();
    if (t) { t.opts.advance = +e.target.value; save(); render(); }
    return;
  }
  if (e.target.name === 'fmt') {
    const v = document.querySelector('input[name=fmt]:checked').value;
    document.getElementById('optThird').classList.toggle('hidden', v === 'double' || v === 'rr');
    document.getElementById('optGroups').classList.toggle('hidden', v !== 'groups');
    document.getElementById('optDraws').classList.toggle('hidden', v !== 'groups' && v !== 'rr');
    // Селекты best-of по стадиям: группа — для групп/лиги, плей-офф и финал — для сеток.
    document.getElementById('boGroupWrap').classList.toggle('hidden', v !== 'groups' && v !== 'rr');
    document.getElementById('boPoWrap').classList.toggle('hidden', v === 'rr');
    document.getElementById('boFinalWrap').classList.toggle('hidden', v === 'rr');
    document.getElementById('boGroupLbl').textContent = v === 'rr' ? 'Матчи' : 'Группа';
    updatePCount();
  }
});

/* набор из базы: резолвим участника по нику/имени -> MMR */
function regFind(token) {
  const k = (token || '').trim().toLowerCase(); if (!k) return null;
  return DB.players.find(p => (p.nick || '').toLowerCase() === k) || DB.players.find(p => p.name.toLowerCase() === k) || null;
}
function regMmrOf(token) { const p = regFind(token); return p && p.mmr != null ? p.mmr : null; }
function renderRegPick(q) {
  const box = document.getElementById('cRegList'); if (!box) return;
  q = (q || '').trim().toLowerCase();
  if (!q) { box.innerHTML = ''; box.classList.remove('on'); return; }
  const matches = DB.players
    .filter(p => (p.name + ' ' + (p.nick || '')).toLowerCase().includes(q))
    .sort((a, b) => (b.mmr || 0) - (a.mmr || 0)).slice(0, 8);
  box.innerHTML = matches.length
    ? matches.map(p => `<button type="button" class="regpickitem" data-action="pickreg" data-name="${esc(p.nick || p.name)}">
        ${avatarByName(p.nick || p.name)}<span class="rpn">${esc(p.name)}${p.nick ? ` <i>@${esc(p.nick)}</i>` : ''}</span>${posArr(p).length ? `<span class="rpp">${posArr(p).join('/')}</span>` : ''}<span class="rpm">${p.mmr != null ? p.mmr : '—'}</span>
      </button>`).join('')
    : '<div class="note" style="padding:9px 11px">Не найдено. Добавь игрока в базу заранее.</div>';
  box.classList.add('on');
}
function updateCapInfo() {
  const box = document.getElementById('capInfo'); if (!box) return;
  const ta = document.getElementById('cPlayers'); if (!ta) return;
  const capEl = document.getElementById('cCap');
  const cap = capEl ? (parseInt((capEl.value || '').trim(), 10) || 0) : 0;
  const rows = [];
  ta.value.split('\n').forEach((raw, idx) => {
    const s = raw.trim(); if (!s || !s.includes(':')) return;
    const e = parseEntry(s);
    const members = e.members || [];
    const sum = members.reduce((a, m) => a + (regMmrOf(m) || 0), 0);
    const missing = members.filter(m => regMmrOf(m) == null);
    const rem = cap - sum, over = cap > 0 && sum > cap;
    rows.push(`<div class="caprow ${over ? 'over' : ''}">
      <span class="cn">${esc(e.name)} <small>×${members.length}</small></span>
      <span class="cs">${sum}${cap > 0 ? ` / ${cap}` : ''}</span>
      ${cap > 0 ? (over ? `<span class="cbad">−${sum - cap}</span>` : `<span class="crem" data-tip="Осталось до лимита">+${rem} свободно</span>`) : ''}
      ${missing.length ? `<span class="cmiss" data-tip="Нет в базе или без MMR: ${esc(missing.join(', '))}">${missing.length} без MMR</span>` : ''}
      <button class="mini" data-action="teamfill" data-line="${idx}" data-tip="Добавить игрока, который влезает в лимит">＋ игрок</button>
    </div>`);
  });
  box.innerHTML = rows.join('');
}
function teamFillModal(lineIdx) {
  const ta = document.getElementById('cPlayers'); if (!ta) return;
  const cap = parseInt((document.getElementById('cCap').value || '').trim(), 10) || 0;
  const ov = openModal(`
    <div class="mtitle">Добор в команду</div>
    <div class="mbody" style="text-align:left">
      <div class="note" id="tfSum" style="margin-bottom:8px"></div>
      <input id="tfSearch" placeholder="🔎 Поиск по базе…" autocomplete="off">
      <div id="tfList" class="laList"></div>
    </div>
    <div class="mrow"><span style="flex:1"></span><button class="btn ghost" id="tfClose">Готово</button></div>`, true);
  const renderList = (q) => {
    const box = ov.querySelector('#tfList'); if (!box) return;
    const cur = ta.value.split('\n');
    if (!(cur[lineIdx] || '').includes(':')) { closeModal(ov); return; }
    const en = parseEntry((cur[lineIdx] || '').trim());
    en.members = en.members || [];
    const sum = en.members.reduce((a, m) => a + (regMmrOf(m) || 0), 0);
    const rem = cap > 0 ? cap - sum : Infinity;
    const used = new Set();
    cur.forEach(l => { const e2 = parseEntry(l.trim()); if (e2.members) e2.members.forEach(m => used.add(m.toLowerCase())); else if (e2.name) used.add(e2.name.toLowerCase()); });
    ov.querySelector('#tfSum').innerHTML = `<b>${esc(en.name)}</b> ×${en.members.length} · сумма <b>${sum}</b>${cap > 0 ? ` · осталось <b class="${rem < 0 ? 'over-t' : ''}">${rem}</b> до ${cap}` : ''}`;
    q = (q || '').trim().toLowerCase();
    let players = DB.players.filter(p => !used.has((p.nick || '').toLowerCase()) && !used.has(p.name.toLowerCase()));
    if (cap > 0) players = players.filter(p => (p.mmr || 0) <= rem);
    if (q) players = players.filter(p => (p.name + ' ' + (p.nick || '')).toLowerCase().includes(q));
    players = players.sort((a, b) => (b.mmr || 0) - (a.mmr || 0)).slice(0, 50);
    box.innerHTML = players.length
      ? players.map(p => `<button type="button" class="regpickitem tfItem" data-name="${esc(p.nick || p.name)}">
          ${avatarByName(p.nick || p.name)}<span class="rpn">${esc(p.name)}${p.nick ? ` <i>@${esc(p.nick)}</i>` : ''}</span>${posArr(p).length ? `<span class="rpp">${posArr(p).join('/')}</span>` : ''}<span class="rpm">${p.mmr != null ? p.mmr : '—'}</span>
        </button>`).join('')
      : `<div class="note" style="padding:10px">${cap > 0 ? `Никто не влезает в остаток (${rem}). Убери кого-то или подними лимит.` : 'Никого не найдено.'}</div>`;
    box.querySelectorAll('.tfItem').forEach(btn => btn.onclick = () => {
      const c2 = ta.value.split('\n');
      const e3 = parseEntry((c2[lineIdx] || '').trim());
      c2[lineIdx] = e3.name + ': ' + (e3.members || []).concat(btn.dataset.name).join(', ');
      ta.value = c2.join('\n');
      updatePCount();
      renderList(ov.querySelector('#tfSearch').value);
    });
  };
  ov.querySelector('#tfSearch').addEventListener('input', e => renderList(e.target.value));
  ov.querySelector('#tfClose').onclick = () => closeModal(ov);
  ov.onclick = e => { if (e.target === ov && ov._downSelf) closeModal(ov); };
  (DB.players.length ? Promise.resolve() : regLoad()).then(() => renderList(''));
}
function updatePCount() {
  updateCapInfo();
  const el = document.getElementById('pCount');
  if (!el) return;
  const names = document.getElementById('cPlayers').value.split('\n').map(s => s.trim()).filter(Boolean);
  const n = names.length;
  if (!n) { el.innerHTML = ''; return; }
  const fmt = document.querySelector('input[name=fmt]:checked').value;
  if (fmt === 'groups') {
    const G = +document.getElementById('cGroups').value;
    el.innerHTML = `Игроков: <b>${n}</b> → ${Math.min(G, n)} групп(ы) по ~${Math.ceil(n / Math.min(G, n))} чел.`;
  } else if (fmt === 'rr') {
    el.innerHTML = `Игроков: <b>${n}</b> → <b>${n * (n - 1) / 2}</b> матчей, каждый сыграет по ${n - 1}`;
  } else {
    const size = n < 2 ? 2 : nextPow2(n);
    const byes = size - n;
    el.innerHTML = `Игроков: <b>${n}</b> → сетка на ${size}` + (byes ? `, свободных слотов: ${byes}` : ' — ровно, без bye!');
  }
}
document.addEventListener('input', e => {
  if (e.target.id === 'cPlayers') updatePCount();
  if (e.target.id === 'cReg') renderRegPick(e.target.value);
  if (e.target.id === 'cCap') updateCapInfo();
  if (e.target.id === 'pSearch') {
    const q = e.target.value.trim().toLowerCase();
    const match = el => !q || (el.dataset.search || '').includes(q);
    document.querySelectorAll('.prow').forEach(el => { el.style.display = match(el) ? '' : 'none'; });
    document.querySelectorAll('.poschip').forEach(el => { el.style.display = match(el) ? '' : 'none'; });
    document.querySelectorAll('.posrow').forEach(row => {
      const anyVis = [...row.querySelectorAll('.poschip')].some(c => c.style.display !== 'none');
      row.style.display = (q && !anyVis) ? 'none' : '';
    });
  }
});

document.addEventListener('keydown', async e => {
  if (e.key === 'Enter' && e.target.id === 'rosterInput') {
    const t = curT();
    const nn = e.target.value.trim();
    if (!t || !nn) return;
    await addPlayerByName(t, nn);
    const ni = document.getElementById('rosterInput');
    if (ni) ni.focus();
  }
  if (e.key === 'Escape' && rosterOpen && !document.querySelector('.overlay')) {
    rosterOpen = false;
    render();
  }
  if (e.key === 'Escape' && tvMode && !document.querySelector('.overlay')) {
    tvMode = false;
    document.body.classList.remove('tv');
    render();
  }
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || document.querySelector('.overlay')) return;
    const t = curT();
    if (view.screen === 'tour' && t && !canEdit(t)) return;
    e.preventDefault();
    undoLast();
  }
});

document.addEventListener('submit', async e => {
  if (e.target.id !== 'createForm') return;
  e.preventDefault();
  const name = document.getElementById('cName').value.trim() || 'Турнир';
  const fmt = document.querySelector('input[name=fmt]:checked').value;
  const cap = parseInt((document.getElementById('cCap').value || '').trim(), 10) || 0;
  const opts = {
    thirdPlace: document.getElementById('cThird').checked,
    groupCount: +document.getElementById('cGroups').value,
    boGroup: +document.getElementById('cBoGroup').value,
    boPlayoff: +document.getElementById('cBoPo').value,
    boFinal: +document.getElementById('cBoFinal').value,
    draws: document.getElementById('cDraws').checked,
    ptsWin: parseInt(document.getElementById('cPtsW').value, 10) || 0,
    ptsDraw: parseInt(document.getElementById('cPtsD').value, 10) || 0,
    ptsLoss: parseInt(document.getElementById('cPtsL').value, 10) || 0,
    mmrCap: cap,
    info: {
      when: document.getElementById('cWhen').value.trim(),
      venue: document.getElementById('cVenue').value.trim(),
      rules: document.getElementById('cRules').value.trim()
    },
    advance: 2
  };
  if (createMode === 'draft') { createDraftTournament(name, fmt, opts); return; }
  const names = document.getElementById('cPlayers').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (names.length < 2) { uiAlert('Нужно минимум два участника — впиши их в поле, по одному на строку.'); return; }
  if (cap > 0) {
    const over = names.map(parseEntry).filter(en => en.members && en.members.length)
      .map(en => ({ name: en.name, sum: en.members.reduce((a, m) => a + (regMmrOf(m) || 0), 0) }))
      .filter(x => x.sum > cap);
    if (over.length && !await uiConfirm(`Превышают лимит ${cap} MMR: ${over.map(x => `${x.name} (${x.sum})`).join(', ')}. Всё равно создать?`, { title: 'Лимит MMR', ok: 'Создать', danger: true })) return;
  }
  createTournament(name, fmt, names, opts);
});

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && tvMode) {
    tvMode = false;
    document.body.classList.remove('tv');
    render();
  }
});

document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = async () => {
    try {
      const data = JSON.parse(fr.result);
      if (!data || !Array.isArray(data.tournaments)) throw new Error('bad');
      if (!await uiConfirm(`В файле ${data.tournaments.length} турнир(ов). Текущие данные будут заменены.`, { title: 'Импорт', ok: 'Загрузить' })) return;
      DB = data;
      save();
      view = { screen: 'home', tid: null };
      render();
      toast('Данные загружены', '📂');
    } catch (err) { uiAlert('Не получилось прочитать файл — это не экспорт Random Cup.'); }
  };
  fr.readAsText(f);
  e.target.value = '';
});

render();
initLiveFromURL();
lobbyLoad();          // для бейджа «вас откликнули» на главной
ensureLobbyRealtime(); // живое обновление лобби/заявок
tourCloudLoad();       // восстановить турниры из облака (если вошёл организатором)
</script>
</body>
